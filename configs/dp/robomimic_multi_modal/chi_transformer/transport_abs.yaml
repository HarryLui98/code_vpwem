pipeline_name: dp_robomimic
# env
env_name: transport
env_type: ph
abs_action: true
dataset_path: PATH_TO_DATASET/robomimic/${env_name}/${env_type}/image_abs.hdf5
mode: train
max_episode_steps: 700
render_obs_key: 'shouldercamera0_image'
shape_meta:
  action:
    shape: [20]
  obs:
    shouldercamera0_image:
      shape: [3, 84, 84]
      type: rgb
    robot0_eye_in_hand_image:
      shape: [3, 84, 84]
      type: rgb
    robot0_eef_pos:
      shape: [3]
      type: low_dim
    robot0_eef_quat:
      shape: [4]
      type: low_dim
    robot0_gripper_qpos:
      shape: [2]
      type: low_dim
    shouldercamera1_image:
      shape: [3, 84, 84]
      type: rgb
    robot1_eye_in_hand_image:
      shape: [3, 84, 84]
      type: rgb
    robot1_eef_pos:
      shape: [3]
      type: low_dim
    robot1_eef_quat:
      shape: [4]
      type: low_dim
    robot1_gripper_qpos:
      shape: [2]
      type: low_dim
action_dim: 20
obs_steps: 2
action_steps: 8
# obs_encoder
rgb_model: resnet18
resize_shape: null
crop_shape:
  - 76
  - 76
random_crop: true
use_group_norm: true
use_seq: true
# train
device: cuda:0
seed: 0
gradient_steps: 1000000
batch_size: 64
horizon: 10
nn: chi_transformer
diffusion: ddpm
sample_steps: 50
temperature: 1.0
# optimizer
lr: 0.0001
# eval
model_path: path/to/model
num_envs: 15
eval_episodes: 30
save_video: false
eval_freq: 100000
# log
exp_name: ${env_name}_${env_type}/obs_${obs_steps}_act_${action_steps}
save_path: PATH_TO_SAVE_MODEL
project: CleanDiffuser
group: dp_robomimic_multi_modal
wandb_mode: offline
log_freq: 1000
save_freq: 50000
resume: False
# work_dir: ${save_path}/${pipeline_name}/${mode}/${env_name}/${exp_name}_${now:%Y%m%d_%H%M%S}/${seed}
work_dir: ${save_path}/robomimic/dp/${exp_name}/${seed}
# hydra
hydra:
  run:
    dir: ${work_dir}
  job:
    chdir: false



