pipeline_name: dp_robomimic
# env
env_name: tool_hang
env_type: ph
abs_action: true
dataset_path: PATH_TO_DATASET/robomimic/${env_name}/${env_type}/image_abs.hdf5
mode: train
max_episode_steps: 700
render_obs_key: 'sideview_image'
shape_meta:
  obs:
    dp_emb:
      shape:
      - 256
      type: low_dim
  action: 
    shape: [10]
action_dim: 10
obs_steps: 8
action_steps: 8
# obs_encoder
rgb_model: resnet18
resize_shape: null
crop_shape:
  - 216
  - 216
random_crop: true
use_group_norm: true
use_seq: true
# train
device: cuda:0
seed: 100
gradient_steps: 1000000
batch_size: 64
horizon: 15
nn: chi_transformer
diffusion: ddpm
sample_steps: 50
temperature: 1.0
# optimizer
lr: 0.0001
# eval
model_path: path/to/model
num_envs: 10
eval_episodes: 50
save_video: false
eval_freq: 100000
# log
exp_name: ${env_name}_${env_type}/obs_${obs_steps}_act_${action_steps}
save_path: PATH_TO_SAVE_MODEL
project: CleanDiffuser
group: dp_robomimic_multi_modal
wandb_mode: offline
log_freq: 1000
save_freq: 50000
resume: False
# work_dir: ${save_path}/${pipeline_name}/${mode}/${env_name}/${exp_name}_${now:%Y%m%d_%H%M%S}/${seed}
work_dir: ${save_path}/robomimic/dp/${exp_name}/${seed}
# hydra
hydra:
  run:
    dir: ${work_dir}
  job:
    chdir: false



